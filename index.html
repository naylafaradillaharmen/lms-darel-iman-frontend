<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0E5C44" />
  <meta name="description" content="Portal Pembelajaran & Tahfizh PKBM Digital Dar El Iman - Pendidikan Kesetaraan Sunnah Berbasis Digital & Sanad Al-Qur'an." />
  <title>PKBM Digital Dar El Iman — Portal Pembelajaran & Tahfizh</title>

  <!-- Prevent Theme Blitz -->
  <script>
    (function() {
      try {
        var t = localStorage.getItem('pkbm_theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) {}
    })();
  </script>

  <!-- Google Fonts: Plus Jakarta Sans, Inter, Amiri -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
</head>
<body class="bg-dei-bg dark:bg-dei-dark-bg text-dei-ink dark:text-dei-dark-ink min-h-screen">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
